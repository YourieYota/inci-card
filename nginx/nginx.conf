# Redirection automatique HTTP (port 80) vers HTTPS (port 443)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Configuration SSL HTTPS (port 443)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Autoriser l'envoi de gros fichiers (images HD, exports)
    client_max_body_size 200M;

    # Défi Certbot Let's Encrypt (si domaine public)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Transférer le trafic HTTPS vers Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
