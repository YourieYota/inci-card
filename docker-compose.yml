services:
  # 1. Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: inci_card_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incicard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incicard_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-incicard_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incicard} -d ${POSTGRES_DB:-incicard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Service IA de détourage d'images (Python rembg / FastAPI)
  rembg-service:
    build:
      context: ./rembg-service
      dockerfile: Dockerfile
    container_name: inci_card_rembg
    restart: always
    environment:
      - PORT=5000

  # 3. Application Web Next.js
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inci_card_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rembg-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-incicard}:${POSTGRES_PASSWORD:-incicard_secret_pass}@db:5432/${POSTGRES_DB:-incicard_db}?sslmode=disable
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change_me_to_a_secure_random_string_32_chars}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - REMBG_SERVICE_URL=http://rembg-service:5000/remove-bg
      - NODE_ENV=production
    volumes:
      - backups_data:/app/backups

  # 4. Proxy Inverse Nginx
  nginx:
    image: nginx:alpine
    container_name: inci_card_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  postgres_data:
  backups_data:
